name: Monthly Format Radar + Pages

on:
  push:
    branches: [main]
  schedule:
    # 09:17 UTC on the 2nd: preceding calendar month is complete.
    # GitHub schedules are best-effort; occasional delay is possible.
    - cron: '17 9 2 * *'
  workflow_dispatch:
    inputs:
      refresh_data:
        description: 'Collect new data before deploying?'
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: format-radar-pages
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      # Until a licensed feed is connected and rights confirmed, publish the existing demo without failing.
      - name: Refresh the last complete calendar month
        if: vars.RADAR_DATA_RIGHTS_CONFIRMED == 'true' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_data))
        env:
          RADAR_FEED_URL: ${{ secrets.RADAR_FEED_URL }}
          RADAR_FEED_TOKEN: ${{ secrets.RADAR_FEED_TOKEN }}
          RADAR_DATA_RIGHTS_CONFIRMED: ${{ vars.RADAR_DATA_RIGHTS_CONFIRMED }}
          RADAR_ALLOW_METADATA_TAGGING: ${{ vars.RADAR_ALLOW_METADATA_TAGGING }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4.1-mini
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_DERIVED_METRICS_APPROVED: ${{ vars.YOUTUBE_DERIVED_METRICS_APPROVED }}
        run: python scripts/refresh.py

      - name: Commit refreshed snapshot to repository
        if: vars.RADAR_DATA_RIGHTS_CONFIRMED == 'true' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_data))
        run: |
          git config user.name 'format-radar-bot'
          git config user.email 'format-radar-bot@users.noreply.github.com'
          git add site/data/latest.json site/data/index.json site/data/archive/
          if ! git diff --cached --quiet; then
            git commit -m 'data: monthly format radar update'
            git push
          else
            echo 'No changed data to commit.'
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
